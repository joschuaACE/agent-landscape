[project]
name = "agent-landscape"
version = "0.1.0"
description = "A2A-compatible multi-agent orchestration (agents, sub-agents, swarms) on LiteLLM, with a hex strategy-map live UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "litellm>=1.60",
    "mcp>=1.10",  # litellm imports its MCP bridge for every request that carries tools
    "python-dotenv>=1.0",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1",  # PDF / Office attachments → markdown for agents
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# tools behind the agents' sandboxed `run_check` (coverage / lint / dead_code checks)
checks = ["pytest-cov>=5", "ruff>=0.6", "vulture>=2.11"]

[project.scripts]
agent-landscape = "agent_landscape.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_landscape"]

[tool.ruff]
line-length = 120
extend-exclude = ["workspace", "data"]

[tool.ruff.lint]
# real problems only (unused / undefined names, likely bugs) – also what the agents' `lint` check reports
select = ["F", "B", "E9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
