[project]
name = "agent-landscape"
version = "0.1.0"
description = "A2A-compatible multi-agent orchestration (agents, sub-agents, swarms) on LiteLLM, with a hex strategy-map live UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "litellm>=1.60",
    "mcp>=1.10",  # litellm imports its MCP bridge for every request that carries tools
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
agent-landscape = "agent_landscape.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_landscape"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
